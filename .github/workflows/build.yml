name: Gerar APK Android e EXE Windows

on:
  push:
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Criar estrutura Android e liberar HTTP/Internet
        run: |
          flutter create --platforms=android .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Aplicativo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows_exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Compilar Executavel Windows (.exe)
        run: |
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Programa-Windows-EXE
          path: build/windows/x64/runner/Release/
