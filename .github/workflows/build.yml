name: Gerar APK Android e EXE Windows

on:
  push:
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17 para o Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar projeto Android e compilar APK
        run: |
          flutter config --enable-android
          flutter create --project-name streamiocast --platforms=android --org com.streamiocast .
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          txt = open(p).read()
          if 'INTERNET' not in txt:
              txt = txt.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application android:usesCleartextTraffic=\"true\"')
              open(p, 'w').write(txt)
          "
          flutter pub get
          flutter build apk --release

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Aplicativo-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows_exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar projeto Windows e compilar EXE
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name streamiocast --platforms=windows --org com.streamiocast .
          flutter pub get
          flutter build windows --release

      - name: Disponibilizar EXE para Download
        uses: actions/upload-artifact@v4
        with:
          name: Programa-Windows-EXE
          path: build/windows/x64/runner/Release/
